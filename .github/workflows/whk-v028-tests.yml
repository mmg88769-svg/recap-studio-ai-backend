name: WHK v0.28 Prototype Tests
on:
  push:
    branches: [dev/whk-recap-video-audio-v028]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check experimental/worker-v028-evidence.js
      - run: node --test tests/worker-v028.test.mjs
