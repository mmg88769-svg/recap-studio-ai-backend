name: WHK v0.28 Prototype Tests
on:
  push:
    branches: [dev/whk-recap-video-audio-v028]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check experimental/worker-v028-evidence.js
      - run: node --test tests/worker-v028.test.mjs

      - name: Test video audio extraction and MP4 mixing
        run: python3 tests/video_pipeline_smoke.py

      - name: Test audio transcription prototype
        run: node --test tests/transcribe-audio-v028.test.mjs

      - name: Validate movie timeline transcript merge
        run: python3 -m unittest discover -s tests -p 'test_merge_transcripts.py'

      - name: Validate scene planning and evidence
        run: python3 -m unittest discover -s tests -p 'test_plan_scenes.py'

      - name: Validate real scene-cut and narration MP4 render
        run: python3 -m unittest discover -s tests -p 'test_render_recap.py'

      - name: Validate offline recap orchestration
        run: python3 -m unittest discover -s tests -p 'test_offline_pipeline.py'
