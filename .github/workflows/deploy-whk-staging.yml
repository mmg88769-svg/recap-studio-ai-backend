name: Deploy W.H.K Video AI to Cloudflare STAGING

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whk-staging-cloudflare
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging Worker only
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed AI feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/whk-video-analysis-v07
          persist-credentials: false

      - name: Verify selected staging branch
        run: |
          test "$(git branch --show-current)" = "feature/whk-video-analysis-v07" || { echo "::error::Unexpected checkout branch"; exit 1; }
          grep -q 'Recap Studio AI v0.7' worker.js || { echo "::error::Expected staging worker v0.7 not found"; exit 1; }

      - name: Verify Cloudflare deployment credentials exist
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub Actions secret"; exit 1; }
          test -n "$ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID GitHub Actions secret"; exit 1; }

      - name: Confirm separate staging destination
        run: |
          test -f worker.js
          echo "Deploying to whk-movie-recap-staging, not recap-studio-ai-backend"

      - name: Deploy STAGING (never production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy worker.js \
            --name whk-movie-recap-staging \
            --compatibility-date 2026-11-01

      - name: Deployment note
        run: |
          echo "STAGING worker code deployed. Add GEMINI_API_KEY and APP_TOKEN to staging worker separately (never post them in chat)."
          echo "Production recap-studio-ai-backend was NOT changed."
