name: Deploy W.H.K Video AI to Cloudflare STAGING

on:
  push:
    branches: [dev/whk-recap-video-audio-v028]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: whk-staging-cloudflare
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy staging Worker only
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout reviewed AI feature branch
        uses: actions/checkout@v4
        with:
          ref: dev/whk-recap-video-audio-v028
          persist-credentials: false

      - name: Verify Cloudflare deployment credentials exist
        env:
          API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          test -n "$API_TOKEN" || { echo "::error::Missing CLOUDFLARE_API_TOKEN GitHub Actions secret"; exit 1; }
          test -n "$ACCOUNT_ID" || { echo "::error::Missing CLOUDFLARE_ACCOUNT_ID GitHub Actions secret"; exit 1; }

      - name: Confirm separate staging destination
        run: |
          test -f worker.js
          echo "Deploying to whk-movie-recap-staging, not recap-studio-ai-backend"

      - name: Deploy STAGING (never production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@4 deploy worker.js \
            --name whk-movie-recap-staging \
            --compatibility-date 2026-11-01
      - name: Verify v0.28 staging API routes and secrets
        run: |
          set -euo pipefail
          HEALTH="$(curl --silent --show-error --fail https://whk-movie-recap-staging.mmg88769.workers.dev/health)"
          echo "$HEALTH" | python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("version") == "0.28-prototype", d; assert d.get("ai_configured") is True, "Cloudflare Worker must have APP_TOKEN and GEMINI_API_KEY secrets configured"; print("Staging health OK:", d.get("version"), d.get("capabilities"))'
          for route in /api/transcribe-audio /api/analyze-evidence /api/tts; do
            STATUS="$(curl --silent --show-error --output /tmp/route-check.json --write-out '%{http_code}' --request POST "https://whk-movie-recap-staging.mmg88769.workers.dev$route" --header 'Content-Type: application/json' --data '{}')"
            test "$STATUS" = "401" || { echo "::error::Unexpected $STATUS from $route (expected protected route HTTP 401 without token)"; cat /tmp/route-check.json; exit 1; }
            echo "Protected route exists: $route"
          done

      - name: Deployment note
        run: |
          echo "STAGING worker code deployed. Add GEMINI_API_KEY and APP_TOKEN to staging worker separately (never post them in chat)."
          echo "Production recap-studio-ai-backend was NOT changed."
