name: Myanmar SRT Backend Tests

on:
  push:
    branches: [feat/myanmar-srt-backend-clean-v1]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile Python source
        run: python -m compileall -q app
      - name: Run unit tests
        run: pytest -q
